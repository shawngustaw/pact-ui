services:
  pact-ui:
    build: .
    ports:
      - '3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      PACT_BROKER_URL: ${PACT_BROKER_URL:-}
      PACT_BROKER_ALLOWED_URLS: ${PACT_BROKER_ALLOWED_URLS:-}
      PACT_UI_DEMO: ${PACT_UI_DEMO:-false}
    restart: unless-stopped
